version: "3.9"
services:
  gateway:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports: ["80:80"]
    depends_on: [auth, crm, agenda, ai, media, bot]
    networks: [mesh]
    labels:
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
      # Repetir para crm, agenda, ai, media, bot

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=crmink
      - POSTGRES_USER=crmink
      - POSTGRES_PASSWORD=crmink
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [mesh]

  redis:
    image: redis:7
    networks: [mesh]

  minio:
    image: minio/minio
    command: server /data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports: ["9000:9000","9001:9001"]
    volumes: ["minio:/data"]
    networks: [mesh]

  auth:
    build: ./services/auth-service
    environment: &common_env
      DATABASE_URL: postgresql+psycopg://crmink:crmink@db:5432/crmink
      JWT_SECRET: supersecret
      JWT_EXPIRE_MINUTES: 60
    depends_on: [db]
    networks: [mesh]
    labels:
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"

  crm:
    build: ./services/crm-service
    environment: *common_env
    depends_on: [db]
    networks: [mesh]
    labels:
      - "traefik.http.routers.crm.rule=PathPrefix(`/crm`)"
      - "traefik.http.services.crm.loadbalancer.server.port=8000"

  agenda:
    build: ./services/agenda-service
    environment: *common_env
    depends_on: [db]
    networks: [mesh]
    labels:
      - "traefik.http.routers.agenda.rule=PathPrefix(`/agenda`)"
      - "traefik.http.services.agenda.loadbalancer.server.port=8000"

  ai:
    build: ./services/ai-service
    environment:
      - LLM_PROVIDER=openai        # o ollama
      - OPENAI_API_KEY=changeme
    networks: [mesh]
    labels:
      - "traefik.http.routers.ai.rule=PathPrefix(`/ai`)"
      - "traefik.http.services.ai.loadbalancer.server.port=8000"

  media:
    build: ./services/media-service
    environment:
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=portfolio
      - S3_ACCESS_KEY=minio
      - S3_SECRET_KEY=minio123
    depends_on: [minio]
    networks: [mesh]
    labels:
      - "traefik.http.routers.media.rule=PathPrefix(`/media`)"
      - "traefik.http.services.media.loadbalancer.server.port=8000"

  bot:
    build: ./services/bot-service
    environment:
      - TELEGRAM_BOT_TOKEN=changeme
      - BASE_API_URL=http://gateway
    networks: [mesh]
    labels:
      - "traefik.http.routers.bot.rule=PathPrefix(`/bot`)"
      - "traefik.http.services.bot.loadbalancer.server.port=8000"

volumes: { pgdata: {}, minio: {} }
networks: { mesh: {} }
